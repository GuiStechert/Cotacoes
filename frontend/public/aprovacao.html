<div class="eyebrow"><a href="/cotacoes">COTAÇÕES</a><span>/</span>APROVAÇÃO</div>
<header class="page-heading"><div><h1>{{podeDecidir?'Aprovar cotação':'Detalhe da cotação'}}</h1><p>#{{cotacao()?.id?.slice(0,8)?.toUpperCase()}} · Confira cada produto antes de confirmar.</p></div><template v-if="cotacao()"><span class="status" :data-status="(cotacao()).status">{{rotulos[(cotacao()).status]}}</span></template></header>
<template v-if="erro()"><div class="notice error" role="alert">{{erro()}}</div></template>
<template v-if="cotacao()"><div class="approval-metrics"><section class="panel"><span>Preço total</span><strong>{{moeda((cotacao()).precoTotal)}}</strong></section><section class="panel"><span>Margem real ponderada</span><strong>{{percentual((cotacao()).margemRealPonderada)}}</strong></section><section class="panel"><span>Alçada responsável</span><strong class="role-title">{{rotulos[(cotacao()).perfilAprovador||'']}}</strong></section></div>
<section class="panel"><div class="panel-bar"><div><h2>Decisões por produto</h2><span class="count">{{(cotacao()).itens.length}} itens</span></div><template v-if="podeDecidir"><span class="subtle">Desmarque para reprovar</span></template></div>
 <template v-if="podeDecidir"><div class="notice inline"><span aria-hidden="true">ⓘ</span> Os itens continuam pendentes até a confirmação. O comentário de reprovação é opcional.</div></template>
 <div class="table-scroll"><table class="approval-table"><thead><tr><th>Produto</th><th class="numeric">Quantidade</th><th class="numeric">Preço unitário</th><th class="numeric">Margem real</th><th class="actions-heading">Decisão</th></tr></thead><tbody>
 <template v-for="(item, $index) in (cotacao()).itens" :key="item.id"><tr><td><strong>{{nome(item.produtoId)}}</strong><small>Item #{{item.id.slice(0,8).toUpperCase()}}</small></td><td class="numeric">{{numero(item.quantidade)}}</td><td class="numeric amount">{{moeda(item.preco)}}</td><td class="numeric margin-cell">{{percentual(item.margemReal)}}</td><td>
  <template v-if="item.status==='PENDENTE'&&podeDecidir"><label class="checkbox"><input type="checkbox" :checked="escolhas[item.id].aprovado" @change="alterar(item.id,$event.target.checked)" :disabled="ocupado()" :aria-label="'Aprovar '+nome(item.produtoId)"> {{escolhas[item.id].aprovado?'Aprovar':'Reprovar'}}</label></template>
  <template v-else><span class="status" :data-status="item.status">{{rotulos[item.status]}}</span></template>
 </td></tr>
 <template v-if="item.status==='PENDENTE'&&podeDecidir&&!escolhas[item.id].aprovado"><tr class="comment-row"><td colspan="5"><label>Comentário de reprovação <span class="optional">(opcional)</span><textarea :data-comment="item.id" v-model="escolhas[item.id].comentario" :disabled="ocupado()" rows="2" placeholder="Se desejar, explique o motivo da reprovação."></textarea></label></td></tr></template>
 <template v-if="item.status!=='PENDENTE'&&comentario(item.id)"><tr class="comment-row"><td colspan="5"><p>{{comentario(item.id)}}</p></td></tr></template>
 </template></tbody></table></div>
 <template v-if="podeDecidir"><footer class="approval-footer"><p><strong>{{aprovados}}</strong> a aprovar <span>·</span> <strong>{{reprovados}}</strong> a reprovar</p><button class="btn primary" type="button" @click="abrirConfirmacao()" :disabled="ocupado()">Revisar decisões →</button></footer></template>
</section>
<template v-if="historico().length"><section class="panel"><div class="panel-bar"><h2>Histórico de decisões</h2></div><div class="timeline"><template v-for="(e, $index) in historico()" :key="e.id"><article><span class="status" :data-status="e.decisao">{{rotulos[e.decisao]}}</span><div><strong>{{e.autorNome}}</strong><small>{{dataHora(e.criadoEm)}}</small><template v-if="e.comentario"><p>{{e.comentario}}</p></template></div></article></template></div></section></template>
<a class="back-link" href="/cotacoes">← Voltar às cotações</a></template>
<template v-if="confirmando()"><section class="confirmation" role="region" aria-label="Confirmar decisões"><div><h2>Confirmar as decisões?</h2><p>{{aprovados}} itens aprovados e {{reprovados}} reprovados. As decisões não poderão ser alteradas.</p></div><div class="button-group"><button type="button" class="btn" @click="confirmando.set(false)" :disabled="ocupado()">Voltar à revisão</button><button type="button" class="btn primary" @click="confirmar()" :disabled="ocupado()">{{ocupado()?'Registrando…':'Confirmar decisões'}}</button></div></section></template>
